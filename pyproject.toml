[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "retailrag-ai"
version = "0.1.0"
description = "Context-aware omnichannel retail recommendations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
  "streamlit>=1.42,<2",
  "SQLAlchemy>=2.0.36,<2.1",
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.6,<2",
  "chromadb>=1.0,<2",
  "langchain-chroma>=0.2,<2",
  "langchain-core>=1,<2",
  "langchain-text-splitters>=0.3,<2",
  "filelock>=3.16,<4",
  "langgraph>=1.0,<2",
  "plotly>=6,<7",
  "Pillow>=11,<14",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
retailrag-data = "retailrag.data_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
