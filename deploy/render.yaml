# Preparation only. Importing this Blueprint later provisions paid services.
# Keep traffic restricted until the existing database/index have been restored.
services:
  - type: web
    name: retailrag-api
    runtime: python
    region: singapore
    plan: standard
    autoDeployTrigger: 'off'
    buildCommand: pip install .
    startCommand: uvicorn retailrag.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /ready
    disk:
      name: retailrag-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.18
      - key: RETAILRAG_ENVIRONMENT
        value: production
      - key: RETAILRAG_DATABASE_URL
        value: sqlite:////var/data/retailrag.db
      - key: RETAILRAG_RAG_DIRECTORY
        value: /var/data/chroma
      - key: RETAILRAG_RAG_COLLECTION
        value: retailrag_products
      - key: RETAILRAG_RAG_GENERATION_MODE
        value: deterministic
      - key: RETAILRAG_RAG_CHUNK_SIZE
        value: '1000'
